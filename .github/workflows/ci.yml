name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GOAMD64: v2

jobs:
  test:
    name: gofmt, vet, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Native headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libx11-dev libx11-xcb-dev libxext-dev libpango1.0-dev libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxtst-dev xvfb
          pkg-config --exists x11 x11-xcb xrandr xext pangocairo pangoft2 cairo-xlib egl glesv2 xtst
          test -f /usr/include/X11/Xlib-xcb.h

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build -o bin/tipsy ./cmd/tipsy

  gui:
    name: GUI build (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Qt 6 and native headers
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev g++ pkg-config libx11-dev libx11-xcb-dev libxext-dev libpango1.0-dev libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxtst-dev
          pkg-config --exists x11 x11-xcb xrandr xext pangocairo pangoft2 cairo-xlib egl glesv2 xtst
          test -f /usr/include/X11/Xlib-xcb.h
      - name: Build GUI
        run: go build -o bin/tipsy-gui ./cmd/tipsy-gui
