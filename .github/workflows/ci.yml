name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOAMD64: v2
  CGO_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        env:
          CGO_ENABLED: "0"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

  ubuntu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
          - name: Ubuntu 22.04
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The source-admission test inspects reviewed historical blobs.
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Native headers and Qt 6
        run: scripts/ci-install-native.sh

      - name: Vet, test, and build
        run: scripts/ci-test-build.sh

  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Bookworm
            image: debian:bookworm-slim
          - name: Fedora 43
            image: fedora:43
    steps:
      - name: Install base tooling (git, file)
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git file
          else
            dnf install -y --setopt=install_weak_deps=False ca-certificates curl git file
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The source-admission test inspects reviewed historical blobs.
          fetch-depth: 0

      - name: Trust the workspace for git-based tests
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Native headers and Qt 6
        run: scripts/ci-install-native.sh

      - name: Vet, test, and build
        run: scripts/ci-test-build.sh

  result:
    name: CI
    if: always()
    needs: [format, ubuntu, distro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required jobs succeeded
        run: |
          set -euo pipefail
          test "${{ needs.format.result }}" = "success"
          test "${{ needs.ubuntu.result }}" = "success"
          test "${{ needs.distro.result }}" = "success"
