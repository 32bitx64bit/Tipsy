name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: gofmt, vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Native headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libx11-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build -o bin/tipsy ./cmd/tipsy

  gui:
    name: GUI build (optional Qt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev pkg-config g++
      - name: Build GUI
        run: go build -o bin/tipsy-gui ./cmd/tipsy-gui
