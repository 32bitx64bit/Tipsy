name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOAMD64: v3
  CGO_ENABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        env:
          CGO_ENABLED: "0"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

  ubuntu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            mode: full
          - name: Ubuntu 22.04
            os: ubuntu-22.04
            mode: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The source-admission test inspects reviewed historical blobs.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Native sources feed cgo object files in GOCACHE; their content must
          # invalidate the build cache as well as the module cache.
          cache-dependency-path: |
            go.sum
            native/**

      - name: Native headers and Qt 6
        run: scripts/ci-install-native.sh

      - name: Vet, test, and build
        run: scripts/ci-test-build.sh ${{ matrix.mode }}

      - name: Vet, test, and build (official_release)
        if: matrix.mode == 'full'
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-Wl,-z,relro,-z,now"
          if [ -d /tmp/tipsy-ci-pkgconfig ]; then
            export PKG_CONFIG_PATH="/tmp/tipsy-ci-pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          fi
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-offscreen}"
          export DISPLAY=:98
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp >/tmp/tipsy-xvfb-official.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 50); do
            [ -S /tmp/.X11-unix/X98 ] && break
            sleep 0.1
          done
          [ -S /tmp/.X11-unix/X98 ]
          go vet -tags official_release -unsafeptr=false ./...
          mod="$(go list -m)"
          plain_pkgs=()
          while IFS= read -r pkg; do
            case "${pkg#"$mod"/}" in
              internal/android | internal/config | internal/loader | internal/x11 | internal/jni | internal/runtime) ;;
              *) plain_pkgs+=("$pkg") ;;
            esac
          done < <(go list -tags official_release ./...)
          go test -tags official_release -count=1 -timeout 20m "${plain_pkgs[@]}"
          go test -tags official_release -race -count=1 -timeout 10m ./internal/android ./internal/config ./internal/loader ./internal/x11
          go test -tags official_release -race -count=1 -timeout 10m \
            -gcflags="${mod}/internal/jni=-d=checkptr=0" \
            -gcflags="${mod}/internal/runtime=-d=checkptr=0" \
            ./internal/jni ./internal/runtime
          mkdir -p bin
          go build -tags official_release -buildmode=pie -trimpath -o bin/tipsy ./cmd/tipsy
          go build -tags official_release -buildmode=pie -trimpath -o bin/tipsy-gui ./cmd/tipsy-gui
          test -x bin/tipsy
          test -x bin/tipsy-gui

  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Bookworm
            image: debian:bookworm-slim
          - name: Fedora 43
            image: fedora:43
    steps:
      - name: Install base tooling (git, file)
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git file
          else
            dnf install -y --setopt=install_weak_deps=False ca-certificates curl git file
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The source-admission test inspects reviewed historical blobs.
          fetch-depth: 0

      - name: Trust the workspace for git-based tests
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Native sources feed cgo object files in GOCACHE; their content must
          # invalidate the build cache as well as the module cache.
          cache-dependency-path: |
            go.sum
            native/**

      - name: Native headers and Qt 6
        run: scripts/ci-install-native.sh

      - name: Vet, test, and build
        run: scripts/ci-test-build.sh smoke

  result:
    name: CI
    if: always()
    needs: [format, ubuntu, distro]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required jobs succeeded
        run: |
          set -euo pipefail
          test "${{ needs.format.result }}" = "success"
          test "${{ needs.ubuntu.result }}" = "success"
          test "${{ needs.distro.result }}" = "success"
