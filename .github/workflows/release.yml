name: GitHub-signed release

# A protected, immutable v* tag creates exactly one public GitHub release. The
# AppImage receives both a keyless Sigstore bundle and GitHub build provenance.
# No workflow secret or long-lived signing key is used or accepted. The manual
# control is deliberately tag-only: select an existing v* tag in GitHub's ref
# picker; dispatching from a branch is skipped before production is entered.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-signed-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    # The repository's production environment admits only v* tags and requires
    # an explicit reviewer approval before this job receives OIDC or release
    # publication permissions.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout the selected release tag without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; scripts/release-inputs.lock.json
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Fail closed unless the reviewed tag and keyless release policy agree
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          readonly lock=scripts/release-inputs.lock.json
          readonly lock_tool=scripts/release-lock.py
          "$lock_tool" --lock "$lock" --mode github-signed

          python3 - "$lock" .github/workflows/release.yml <<'PY'
          import json
          import sys
          from pathlib import Path

          lock = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          workflow = Path(sys.argv[2]).read_text(encoding="utf-8")
          expected = {
              "actions/checkout": lock["actions"]["checkout"]["commit"],
              "actions/setup-go": lock["actions"]["setup-go"]["commit"],
              "actions/attest": lock["actions"]["attest"]["commit"],
              "sigstore/cosign-installer": lock["actions"]["cosign-installer"]["commit"],
          }
          for action, commit in expected.items():
              needle = f"uses: {action}@{commit}"
              if workflow.count(needle) != 1:
                  raise SystemExit(f"release workflow does not use exactly one locked {action} commit")
          go_version = lock["target"]["go"]
          if workflow.count(f'go-version: "{go_version}"') != 1:
              raise SystemExit("release workflow Go version is not tied to the reviewed lock")
          PY

          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF" == "refs/tags/$GITHUB_REF_NAME" ]]
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9A-Za-z._+-]+$ ]]
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]

          tag_commit=$(git rev-parse --verify "$GITHUB_REF^{commit}")
          event_commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          checkout_commit=$(git rev-parse --verify HEAD)
          [[ "$tag_commit" == "$checkout_commit" ]]
          [[ "$event_commit" == "$checkout_commit" ]]
          [[ -z $(git status --porcelain=v1 --untracked-files=all) ]]
          git diff --no-ext-diff --quiet
          git diff --cached --no-ext-diff --quiet
          ! git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null

          expected_repository=$("$lock_tool" --lock "$lock" --mode github-signed --get source.repository)
          origin=$(git remote get-url origin)
          origin=${origin%.git}
          [[ "$origin" == "$expected_repository" ]]
          [[ "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" == "$expected_repository" ]]

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$checkout_commit" >> "$GITHUB_OUTPUT"
          printf 'lock_digest=%s\n' "$("$lock_tool" --lock "$lock" --mode github-signed --digest)" >> "$GITHUB_OUTPUT"

      - name: Select the exact reviewed Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0; scripts/release-inputs.lock.json
        with:
          go-version: "1.27.1"
          check-latest: false
          cache: false

      - name: Install the native build surface
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap ca-certificates curl file gcc git patchelf pkg-config qmake6 \
            qt6-base-dev libegl1-mesa-dev libgles2-mesa-dev libpango1.0-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxtst-dev
          pkg-config --exists Qt6Widgets Qt6Gui Qt6Core x11 x11-xcb xext xrandr xtst pangocairo pangoft2 cairo-xlib egl glesv2
          test -f /usr/include/X11/Xlib-xcb.h
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-net --new-session --cap-drop ALL true

      - name: Prime the module cache before build isolation
        shell: bash
        run: |
          set -euo pipefail
          expected="go$(scripts/release-lock.py --lock scripts/release-inputs.lock.json --mode github-signed --get target.go)"
          [[ $(go env GOVERSION) == "$expected" ]]
          GOTOOLCHAIN=local go mod download

      - name: Download and verify the pinned AppImage inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          readonly lock=scripts/release-inputs.lock.json
          readonly lock_tool=scripts/release-lock.py
          readonly input_dir="$RUNNER_TEMP/tipsy-release-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$input_dir"

          download_checked() {
            local name=$1 path=$2 expected=$3 uri=$4 actual
            [[ "$uri" == https://github.com/* ]]
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "$path" "$uri"
            actual=$(sha256sum "$path")
            actual=${actual%% *}
            [[ "$actual" == "$expected" ]]
            [[ -f "$path" && ! -L "$path" ]]
            printf '%s\n' "$name=$path" >> "$GITHUB_OUTPUT"
          }

          download_checked \
            appimagetool "$input_dir/appimagetool" \
            "$("$lock_tool" --lock "$lock" --mode github-signed --get downloads.appimagetool.sha256)" \
            "$("$lock_tool" --lock "$lock" --mode github-signed --get downloads.appimagetool.uri)"
          chmod 0755 "$input_dir/appimagetool"
          download_checked \
            runtime "$input_dir/type2-runtime" \
            "$("$lock_tool" --lock "$lock" --mode github-signed --get downloads.type2-runtime.sha256)" \
            "$("$lock_tool" --lock "$lock" --mode github-signed --get downloads.type2-runtime.uri)"

      - name: Build the reproducible keyless release candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          readonly version='${{ steps.preflight.outputs.version }}'
          readonly output="$RUNNER_TEMP/tipsy-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly lock=scripts/release-inputs.lock.json
          readonly lock_tool=scripts/release-lock.py
          install -d -m 0700 "$output"

          scripts/release-build.sh \
            --version "$version" \
            --output-dir "$output" \
            --mode github-signed \
            --release-lock "$lock" \
            --appimagetool '${{ steps.inputs.outputs.appimagetool }}' \
            --appimagetool-sha256 "$("$lock_tool" --lock "$lock" --mode github-signed --get downloads.appimagetool.sha256)" \
            --runtime-file '${{ steps.inputs.outputs.runtime }}' \
            --runtime-sha256 "$("$lock_tool" --lock "$lock" --mode github-signed --get downloads.type2-runtime.sha256)"

          readonly appdir="$output/Tipsy-${version}-x86_64.AppDir"
          readonly archive="$output/Tipsy-${version}-x86_64.AppDir.tar.gz"
          readonly appimage="$output/Tipsy-${version}-x86_64.AppImage"
          readonly evidence="$output/Tipsy-${version}-x86_64.evidence"
          for item in "$archive" "$appimage"; do
            [[ -f "$item" && ! -L "$item" && -s "$item" ]]
          done
          [[ -d "$appdir" && ! -L "$appdir" ]]
          [[ -d "$evidence" && ! -L "$evidence" ]]
          scripts/check-release-tree.sh "$appdir"
          (
            cd "$output"
            sha256sum --strict --check "$evidence/release-hashes.sha256"
          )
          grep -Fx 'release_kind=release-candidate-keyless' "$appdir/usr/share/tipsy/build-info"
          grep -Fx 'source_tree=clean' "$appdir/usr/share/tipsy/build-info"
          grep -Fx 'source_commit=${{ steps.preflight.outputs.commit }}' "$appdir/usr/share/tipsy/build-info"

          printf 'output=%s\n' "$output" >> "$GITHUB_OUTPUT"
          printf 'appimage=%s\n' "$appimage" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"

      - name: Prepare checked SLSA predicate for GitHub attestation
        id: predicate
        shell: bash
        run: |
          set -euo pipefail
          readonly statement='${{ steps.build.outputs.evidence }}/provenance-input.json'
          readonly predicate="$RUNNER_TEMP/tipsy-release-predicate-${GITHUB_RUN_ID}.json"
          python3 - "$statement" "$predicate" '${{ steps.preflight.outputs.commit }}' '${{ steps.preflight.outputs.lock_digest }}' <<'PY'
          import json
          import sys
          from pathlib import Path

          statement = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if statement.get("predicateType") != "https://slsa.dev/provenance/v1":
              raise SystemExit("release evidence has an unexpected predicate type")
          predicate = statement.get("predicate")
          if not isinstance(predicate, dict):
              raise SystemExit("release evidence has no SLSA predicate")
          dependencies = predicate.get("buildDefinition", {}).get("resolvedDependencies", [])
          expected_commit, expected_lock_digest = sys.argv[3:5]
          if {
              "uri": "git+https://github.com/32bitx64bit/Tipsy",
              "digest": {"gitCommit": expected_commit},
          } not in dependencies:
              raise SystemExit("release evidence is not bound to the checked-out commit")
          if {
              "uri": "pkg:generic/tipsy-release-input-lock@1",
              "digest": {"sha256": expected_lock_digest},
          } not in dependencies:
              raise SystemExit("release evidence is not bound to the reviewed lock")
          Path(sys.argv[2]).write_text(
              json.dumps(predicate, ensure_ascii=True, separators=(",", ":"), sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          printf 'path=%s\n' "$predicate" >> "$GITHUB_OUTPUT"

      - name: Attest the AppImage build provenance
        id: attest
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0; scripts/release-inputs.lock.json
        with:
          subject-path: ${{ steps.build.outputs.appimage }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.predicate.outputs.path }}
          show-summary: false

      - name: Install the pinned keyless signing tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2; scripts/release-inputs.lock.json
        with:
          cosign-release: v3.1.3

      - name: Keylessly sign and verify the AppImage
        id: signature
        shell: bash
        run: |
          set -euo pipefail
          readonly appimage='${{ steps.build.outputs.appimage }}'
          readonly bundle="${appimage}.sigstore.json"
          readonly identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          readonly issuer=https://token.actions.githubusercontent.com
          cosign sign-blob --yes --bundle "$bundle" "$appimage"
          [[ -f "$bundle" && ! -L "$bundle" && -s "$bundle" ]]
          cosign verify-blob "$appimage" --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer"
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
          printf 'issuer=%s\n' "$issuer" >> "$GITHUB_OUTPUT"

      - name: Assemble public verification evidence
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          readonly output='${{ steps.build.outputs.output }}'
          readonly version='${{ steps.preflight.outputs.version }}'
          readonly appimage='${{ steps.build.outputs.appimage }}'
          readonly evidence='${{ steps.build.outputs.evidence }}'
          readonly sigstore_bundle='${{ steps.signature.outputs.bundle }}'
          readonly github_bundle='${{ steps.attest.outputs.bundle-path }}'
          readonly verification="$output/Tipsy-${version}-x86_64.VERIFY.txt"
          readonly evidence_archive="$output/Tipsy-${version}-x86_64.evidence.tar.gz"
          readonly checksums="$output/Tipsy-${version}-x86_64.release-sha256.txt"
          readonly notes="$output/Tipsy-${version}-x86_64.RELEASE-NOTES.md"
          readonly identity='${{ steps.signature.outputs.identity }}'
          readonly issuer='${{ steps.signature.outputs.issuer }}'

          install -m 0644 "$github_bundle" "$evidence/github-attestation.sigstore.json"
          install -m 0644 "$sigstore_bundle" "$evidence/$(basename "$sigstore_bundle")"
          sha256sum "$evidence/github-attestation.sigstore.json" > "$evidence/github-attestation.sigstore.sha256"
          sha256sum "$evidence/$(basename "$sigstore_bundle")" > "$evidence/$(basename "$sigstore_bundle").sha256"
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$output" -czf "$evidence_archive" "$(basename "$evidence")"
          sha256sum "$appimage" > "${appimage}.sha256"
          sha256sum "$appimage" "${appimage}.sha256" "$sigstore_bundle" "$evidence_archive" > "$checksums"
          printf '%s\n' \
            'Tipsy GitHub-signed release verification' \
            '' \
            "Artifact: $(basename "$appimage")" \
            "Sigstore bundle: $(basename "$sigstore_bundle")" \
            "GitHub provenance: github-attestation.sigstore.json (inside $(basename "$evidence_archive"))" \
            '' \
            '1. Verify the artifact SHA-256:' \
            "   sha256sum --strict --check $(basename "${appimage}.sha256")" \
            '' \
            '2. Verify the keyless Sigstore signature:' \
            "   cosign verify-blob $(basename "$appimage") --bundle $(basename "$sigstore_bundle") --certificate-identity $identity --certificate-oidc-issuer $issuer" \
            '' \
            '3. Verify GitHub build provenance:' \
            "   gh attestation verify $(basename "$appimage") --repo $GITHUB_REPOSITORY --signer-workflow .github/workflows/release.yml --source-ref $GITHUB_REF --deny-self-hosted-runners" \
            > "$verification"
          printf '%s\n' \
            "Tipsy ${version}" \
            '' \
            'This AppImage was built from the immutable release tag, keylessly signed with GitHub Actions OIDC and Sigstore, and issued a GitHub build-provenance attestation.' \
            'No private signing key, signing secret, or release credential is embedded in the artifact or repository.' \
            '' \
            'Download the AppImage, its SHA-256 file, its Sigstore bundle, and VERIFY.txt. The evidence archive contains the GitHub provenance bundle and deterministic build evidence.' \
            > "$notes"
          for item in "$appimage" "${appimage}.sha256" "$sigstore_bundle" "$evidence_archive" "$checksums" "$verification" "$notes"; do
            [[ -f "$item" && ! -L "$item" && -s "$item" ]]
          done
          printf 'checksums=%s\n' "$checksums" >> "$GITHUB_OUTPUT"
          printf 'evidence_archive=%s\n' "$evidence_archive" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"
          printf 'verification=%s\n' "$verification" >> "$GITHUB_OUTPUT"

      - name: Publish the signed AppImage to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            '${{ steps.build.outputs.appimage }}' \
            '${{ steps.build.outputs.appimage }}.sha256' \
            '${{ steps.signature.outputs.bundle }}' \
            '${{ steps.release_files.outputs.evidence_archive }}' \
            '${{ steps.release_files.outputs.checksums }}' \
            '${{ steps.release_files.outputs.verification }}' \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tipsy ${{ steps.preflight.outputs.version }}" \
            --notes-file '${{ steps.release_files.outputs.notes }}' \
            --verify-tag
